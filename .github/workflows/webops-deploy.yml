name: WebOps Deploy — Media Commerce Peru

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. VALIDACION ────────────────────────────────────────────────────────
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML structure
        run: |
          echo "Validando archivos HTML..."
          errors=0
          for f in Peru/*.html; do
            if grep -q "<html" "$f" && grep -q "</html>" "$f"; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f — estructura HTML invalida"
              errors=$((errors+1))
            fi
          done
          [ $errors -eq 0 ] || { echo "::error::$errors archivo(s) HTML invalidos"; exit 1; }

      - name: Validate nav consistency — Ordenes de servicio
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            if ! grep -q "Ordenes de servicio" "$file"; then
              echo "::warning file=$file::Falta enlace Ordenes de servicio en nav"
              missing=$((missing+1))
            fi
          done < <(find Peru -name "*.html" \
            -not -path "*/Ordenes de servicios/*" \
            -not -path "*/logs/*" \
            -not -path "*/php/*" \
            -print0)
          [ $missing -eq 0 ] && echo "Nav consistency: OK" || \
            { echo "::error::$missing paginas sin el enlace de Ordenes en nav"; exit 1; }

      - name: Validate JS syntax
        run: |
          node --check "Peru/Ordenes de servicios/ordenes-servicio.js"
          node --check "Peru/Ordenes de servicios/login.js"
          echo "JS syntax: OK"

  # ─── 2. PREVIEW EN STAGING (solo en PR) ──────────────────────────────────
  preview:
    name: Deploy Staging Preview
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH para mcp-agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MCP_AGENT_SSH_PRIVATE_KEY }}" > ~/.ssh/mcp-agent-key
          chmod 600 ~/.ssh/mcp-agent-key
          ssh-keyscan -H 179.43.82.54 >> ~/.ssh/known_hosts

      - name: Deploy a Staging via SSH
        run: |
          ssh -i ~/.ssh/mcp-agent-key \
              -o StrictHostKeyChecking=no \
              mcp-agent@179.43.82.54 \
              "sudo /usr/local/bin/update-staging.sh ${{ github.head_ref }}"

      - name: Verificar staging
        id: staging_check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://179.43.82.54:8080 || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          [ "$HTTP_CODE" = "200" ] && echo "Staging OK" || echo "Staging WARNING: HTTP $HTTP_CODE"

      - name: Comentar PR con URL de preview
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const commit = context.payload.pull_request.head.sha.substring(0, 7);
            const httpCode = '${{ steps.staging_check.outputs.http_code }}';
            const status = httpCode === '200' ? '✅ Activo' : `⚠️ HTTP ${httpCode}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## 🔍 Preview desplegado en Staging',
                '',
                `**URL:** http://179.43.82.54:8080`,
                `**Branch:** \`${branch}\``,
                `**Commit:** \`${commit}\``,
                `**Estado:** ${status}`,
                '',
                '| Validacion | Estado |',
                '|------------|--------|',
                '| HTML structure | ✅ OK |',
                '| Nav consistency | ✅ OK |',
                '| JS syntax | ✅ OK |',
                '',
                '---',
                '> **Esperando aprobacion para mergear a `main`.**',
                '> Una vez aprobado y mergeado, el deploy a produccion se ejecuta automaticamente.'
              ].join('\n')
            });

  # ─── 3. DEPLOY PRODUCCION (solo en push a main, post-merge) ──────────────
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://mcperu.pe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH para mcp-agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MCP_AGENT_SSH_PRIVATE_KEY }}" > ~/.ssh/mcp-agent-key
          chmod 600 ~/.ssh/mcp-agent-key
          ssh-keyscan -H 179.43.82.54 >> ~/.ssh/known_hosts

      - name: Deploy a Produccion via SSH
        run: |
          ssh -i ~/.ssh/mcp-agent-key \
              -o StrictHostKeyChecking=no \
              mcp-agent@179.43.82.54 \
              "sudo /usr/local/bin/deploy-mcperu.sh production main"

      - name: Verificar produccion
        id: prod_check
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mcperu.pe || \
                      curl -s -o /dev/null -w "%{http_code}" http://179.43.82.54 || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "301" ]; then
            echo "::error::Produccion responde HTTP $HTTP_CODE — considerar rollback"
            exit 1
          fi
          echo "Produccion OK — HTTP $HTTP_CODE"

      - name: Rollback automatico si deploy falla
        if: failure()
        run: |
          echo "Deploy fallido — ejecutando rollback automatico..."
          ssh -i ~/.ssh/mcp-agent-key \
              -o StrictHostKeyChecking=no \
              mcp-agent@179.43.82.54 \
              "cd /home/mcp-agent/apps/mcperu && git checkout HEAD~1 -- . && sudo systemctl reload nginx"
          echo "::error::Deploy fallido — rollback aplicado al commit anterior"

      - name: Notificar deploy exitoso
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.sha.substring(0, 7);
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: `Deploy produccion OK — commit ${commit}`,
              context: 'Deploy / Production'
            });
