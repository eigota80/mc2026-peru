<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Dashboard | Media Commerce</title>
<link rel="stylesheet" href="../css/core.min.css?v=2.3.19.05.13.0" type="text/css">
<link rel="stylesheet" href="../style.css?v=20260428-global-nav" type="text/css">
<link rel="stylesheet" href="ordenes-servicio.css?v=20260519-multipagina-v1" type="text/css">
<link rel="icon" type="image/png" sizes="32x32" href="../images/system/favicon/favicon-32x32.png?v=2.3.19.05.13.0">
</head>
<body class="os-page">
<main class="os-shell">
	<section class="os-app" id="appView" hidden>
		<header class="os-header">
			<a href="../index.html" class="os-brand" aria-label="Media Commerce">
				<img src="Logo MC siempre presente-02 (1) (2).png" alt="Media Commerce">
			</a>
			<div class="os-header-copy">
				<p class="os-eyebrow">Sistema de Ordenes de Servicio</p>
				<h1 id="viewTitle">Dashboard</h1>
			</div>
			<div class="os-session">
				<strong id="sessionName"></strong>
				<span id="sessionRole"></span>
				<button type="button" class="os-icon-button" id="logoutBtn" aria-label="Cerrar sesion" title="Cerrar sesion">
					<i class="fas fa-sign-out-alt" aria-hidden="true"></i>
				</button>
			</div>
		</header>

		<nav class="os-nav" aria-label="Modulos">
			<a href="index.html" class="os-nav-button">
				<i class="fas fa-home" aria-hidden="true"></i>
				<span>Home</span>
			</a>
			<a href="dashboard.html" class="os-nav-button is-active">
				<i class="fas fa-chart-line" aria-hidden="true"></i>
				<span>Dashboard</span>
			</a>
			<a href="clientes.html" class="os-nav-button">
				<i class="fas fa-building" aria-hidden="true"></i>
				<span>Clientes</span>
			</a>
			<a href="ordenes.html" class="os-nav-button">
				<i class="far fa-file-alt" aria-hidden="true"></i>
				<span>Ordenes</span>
			</a>
			<a href="cotizaciones.html" class="os-nav-button">
				<i class="fas fa-file-invoice-dollar" aria-hidden="true"></i>
				<span>Cotizaciones</span>
			</a>
			<a href="usuarios.html" class="os-nav-button" data-permission="manage_users">
				<i class="fas fa-user-shield" aria-hidden="true"></i>
				<span>Usuarios</span>
			</a>
			<a href="auditoria.html" class="os-nav-button" data-permission="manage_users">
				<i class="fas fa-history" aria-hidden="true"></i>
				<span>Auditoria</span>
			</a>
			<a href="informes.html" class="os-nav-button">
				<i class="fas fa-chart-bar" aria-hidden="true"></i>
				<span>Informes</span>
			</a>
		</nav>

		<div class="os-metrics" aria-label="Indicadores">
			<article>
				<span>Clientes</span>
				<strong id="metricClientes">0</strong>
			</article>
			<article>
				<span>Ordenes</span>
				<strong id="metricOrdenes">0</strong>
			</article>
			<article>
				<span>MRC total</span>
				<strong id="metricMrc">0.00</strong>
			</article>
			<article>
				<span>NRC total</span>
				<strong id="metricNrc">0.00</strong>
			</article>
			<article>
				<span>Cotizaciones</span>
				<strong id="metricCotizaciones">0</strong>
			</article>
		</div>

		<section class="os-panel">
			<div class="os-section-head">
				<h2>Ordenes recientes</h2>
				<button type="button" class="os-button os-button-secondary" data-shortcut="ordenes">Nueva orden</button>
			</div>
			<div class="os-table-wrap">
				<table class="os-table">
					<thead>
						<tr>
							<th>OS</th>
							<th>Cliente</th>
							<th>Fecha</th>
							<th>Estado</th>
							<th>MRC</th>
							<th>NRC</th>
						</tr>
					</thead>
					<tbody id="recentOrdersBody"></tbody>
				</table>
			</div>
		</section>
	</section>
</main>
<script src="ordenes-servicio.js?v=20260519-mariadb-v1"></script>
</body>
</html>
