document.getElementById('btn').addEventListener('click', function() {
  const log = document.getElementById('log');
  log.textContent = 'Importando...\n';
  try {
    const existing = JSON.parse(localStorage.getItem(COT_KEY) || '[]');
    const existingIds = new Set(existing.map(c => c.numerocorrelativo));

    let added = 0, skipped = 0;
    const merged = [...existing];
    DATA.forEach(c => {
      if (existingIds.has(c.numerocorrelativo)) {
        skipped++;
      } else {
        merged.push(c);
        existingIds.add(c.numerocorrelativo);
        added++;
      }
    });
    localStorage.setItem(COT_KEY, JSON.stringify(merged));
    log.textContent = 'IMPORTACION COMPLETADA\n' +
      'Cotizaciones nuevas agregadas: ' + added + '\n' +
      'Cotizaciones ya existentes (omitidas): ' + skipped + '\n' +
      'Total en sistema: ' + merged.length + '\n\n' +
      'Puedes cerrar esta pagina y volver al sistema.';
    document.getElementById('btn').disabled = true;
    document.getElementById('btn').textContent = '✓ Importado';
  } catch(e) {
    log.textContent = 'ERROR: ' + e.message;
  }
});
