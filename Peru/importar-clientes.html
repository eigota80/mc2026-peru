document.getElementById('btn').addEventListener('click', function() {
  const log = document.getElementById('log');
  log.textContent = 'Importando...\n';
  try {
    const existing = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]');
    const existingMap = {};
    existing.forEach(c => { if (c.ruc_dni) existingMap[c.ruc_dni.trim()] = true; });

    let added = 0, skipped = 0;
    const merged = [...existing];
    DATA.forEach(c => {
      if (c.ruc_dni && existingMap[c.ruc_dni.trim()]) {
        skipped++;
      } else {
        merged.push(c);
        if (c.ruc_dni) existingMap[c.ruc_dni.trim()] = true;
        added++;
      }
    });
    localStorage.setItem(CLIENTS_KEY, JSON.stringify(merged));
    log.textContent = 'IMPORTACION COMPLETADA\n' +
      'Clientes nuevos agregados: ' + added + '\n' +
      'Clientes ya existentes (omitidos): ' + skipped + '\n' +
      'Total en sistema: ' + merged.length + '\n\n' +
      'Puedes cerrar esta pagina y volver al sistema.';
    document.getElementById('btn').disabled = true;
    document.getElementById('btn').textContent = '✓ Importado';
  } catch(e) {
    log.textContent = 'ERROR: ' + e.message;
  }
});
</script>
