<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title>Clientes | Media Commerce</title>
<link rel="stylesheet" href="../css/core.min.css?v=2.3.19.05.13.0" type="text/css">
<link rel="stylesheet" href="../style.css?v=20260428-global-nav" type="text/css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="ordenes-servicio.css?v=20260530-backend-v1" type="text/css">
<link rel="icon" type="image/png" sizes="32x32" href="../images/system/favicon/favicon-32x32.png?v=2.3.19.05.13.0">
</head>
<body class="os-page">
<main class="os-shell">
	<section class="os-app" id="appView" hidden>
		<header class="os-header">
			<a href="../index.html" class="os-brand" aria-label="Media Commerce">
				<img src="logo-mc.png?v=20260530" alt="Media Commerce">
			</a>
			<div class="os-header-copy">
				<p class="os-eyebrow">Sistema de Ordenes de Servicio</p>
				<h1 id="viewTitle">Clientes</h1>
			</div>
			<div class="os-session">
				<strong id="sessionName"></strong>
				<span id="sessionRole"></span>
				<button type="button" class="os-icon-button" id="logoutBtn" aria-label="Cerrar sesion" title="Cerrar sesion">
					<i class="fas fa-sign-out-alt" aria-hidden="true"></i>
				</button>
			</div>
		</header>

		<nav class="os-nav" aria-label="Modulos">
			<a href="index.html" class="os-nav-button">
				<i class="fas fa-home" aria-hidden="true"></i>
				<span>Home</span>
			</a>
			<a href="dashboard.html" class="os-nav-button">
				<i class="fas fa-chart-line" aria-hidden="true"></i>
				<span>Dashboard</span>
			</a>
			<a href="Clientes.html" class="os-nav-button is-active">
				<i class="fas fa-building" aria-hidden="true"></i>
				<span>Clientes</span>
			</a>
			<a href="ordenes.html" class="os-nav-button">
				<i class="far fa-file-alt" aria-hidden="true"></i>
				<span>Ordenes</span>
			</a>
			<a href="cotizaciones.html" class="os-nav-button">
				<i class="fas fa-file-invoice-dollar" aria-hidden="true"></i>
				<span>Cotizaciones</span>
			</a>
			<a href="usuarios.html" class="os-nav-button" data-permission="manage_users">
				<i class="fas fa-user-shield" aria-hidden="true"></i>
				<span>Usuarios</span>
			</a>
			<a href="auditoria.html" class="os-nav-button" data-permission="manage_users">
				<i class="fas fa-history" aria-hidden="true"></i>
				<span>Auditoria</span>
			</a>
			<a href="informes.html" class="os-nav-button">
				<i class="fas fa-chart-bar" aria-hidden="true"></i>
				<span>Informes</span>
			</a>
		</nav>

		<section class="os-panel">
			<div class="os-section-head">
				<h2>Buscar cliente</h2>
				<span class="os-pill" id="clientSearchState">Busqueda requerida</span>
			</div>
			<form id="clientSearchForm" class="os-inline-form" autocomplete="off">
				<label>
					<span>RUC/DNI o razon social</span>
					<input type="search" id="clientSearch" required>
				</label>
				<button type="submit" class="os-button os-button-primary">
					<i class="fas fa-search" aria-hidden="true"></i>
					<span>Buscar</span>
				</button>
			</form>
			<div class="os-results" id="clientResults"></div>
		</section>

		<section class="os-panel" id="clientFormPanel">
			<div class="os-section-head">
				<h2 id="clientFormTitle">Crear cliente</h2>
				<button type="button" class="os-button os-button-secondary" id="newClientBtn">
					<i class="fas fa-plus" aria-hidden="true"></i>
					<span>Nuevo</span>
				</button>
			</div>
			<form id="clientForm" class="os-form" autocomplete="on">
				<input type="hidden" id="clienteId" name="clienteId">
				<div class="os-grid os-grid-two">
					<label>
						<span>Razon social</span>
						<input type="text" id="clienteRazonSocial" name="razon_social" required>
					</label>
					<label>
						<span>RUC/DNI</span>
						<input type="text" id="clienteDocumento" name="ruc_dni" required>
					</label>
					<label>
						<span>Representante legal</span>
						<input type="text" id="clienteRepresentante" name="representante_legal">
					</label>
					<label>
						<span>Telefono</span>
						<input type="tel" id="clienteTelefono" name="telefono">
					</label>
					<label>
						<span>Domicilio</span>
						<input type="text" id="clienteDomicilio" name="domicilio">
					</label>
					<label>
						<span>Email</span>
						<input type="email" id="clienteEmail" name="email">
					</label>
					<label>
						<span>Contacto tecnico</span>
						<input type="text" id="clienteContactoTecnico" name="contacto_tecnico">
					</label>
					<label>
						<span>Contacto administrativo</span>
						<input type="text" id="clienteContactoAdministrativo" name="contacto_administrativo">
					</label>
				</div>
				<div class="os-form-actions">
					<button type="submit" class="os-button os-button-primary" data-permission="create_clients">Guardar cliente</button>
					<p class="os-alert" id="clientMessage" role="status" hidden></p>
				</div>
			</form>
		</section>
	</section>
</main>
<script src="ordenes-servicio.js?v=20260530-backend-v1"></script>
</body>
</html>
