<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title>Ingreso | Ordenes de Servicio | Media Commerce</title>
<link rel="stylesheet" href="../css/core.min.css?v=2.3.19.05.13.0" type="text/css">
<link rel="stylesheet" href="../style.css?v=20260428-global-nav" type="text/css">
<link rel="stylesheet" href="ordenes-servicio.css?v=20260530-backend-v1" type="text/css">
<link rel="icon" type="image/png" sizes="32x32" href="../images/system/favicon/favicon-32x32.png?v=2.3.19.05.13.0">
</head>
<body class="os-page">
<main class="os-shell">
	<section class="os-login-view" id="loginView" aria-labelledby="loginTitle">
		<div class="os-login-brand">
			<a href="../index.html" class="os-brand" aria-label="Media Commerce">
				<img src="logo-mc.png" alt="Media Commerce">
			</a>
			<p class="os-eyebrow">Sistema comercial</p>
			<h1 id="loginTitle">Ordenes de Servicio</h1>
		</div>
		<form id="loginForm" class="os-login-panel" autocomplete="on" method="post">
			<label>
				<span>Email</span>
				<input type="email" id="loginEmail" name="email" autocomplete="username" required autofocus>
			</label>
			<label>
				<span>Clave</span>
				<input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
			</label>
			<div class="os-login-actions">
				<button type="submit" class="os-button os-button-primary">Ingresar</button>
			</div>
			<p class="os-alert" id="loginMessage" role="alert" hidden></p>
		</form>
	</section>
</main>
<script src="login.js?v=20260518"></script>
</body>
</html>
