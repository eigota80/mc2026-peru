<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow">
<title>Usuarios | Media Commerce</title>
<link rel="stylesheet" href="../css/core.min.css?v=2.3.19.05.13.0" type="text/css">
<link rel="stylesheet" href="../style.css?v=20260428-global-nav" type="text/css">
<link rel="stylesheet" href="ordenes-servicio.css?v=20260519-multipagina-v1" type="text/css">
<link rel="icon" type="image/png" sizes="32x32" href="../images/system/favicon/favicon-32x32.png?v=2.3.19.05.13.0">
</head>
<body class="os-page">
<main class="os-shell">
	<section class="os-app" id="appView" hidden>
		<header class="os-header">
			<a href="../index.html" class="os-brand" aria-label="Media Commerce">
				<img src="logo-mc.png" alt="Media Commerce">
			</a>
			<div class="os-header-copy">
				<p class="os-eyebrow">Sistema de Ordenes de Servicio</p>
				<h1 id="viewTitle">Usuarios</h1>
			</div>
			<div class="os-session">
				<strong id="sessionName"></strong>
				<span id="sessionRole"></span>
				<button type="button" class="os-icon-button" id="logoutBtn" aria-label="Cerrar sesion" title="Cerrar sesion">
					<i class="fas fa-sign-out-alt" aria-hidden="true"></i>
				</button>
			</div>
		</header>

		<nav class="os-nav" aria-label="Modulos">
			<a href="index.html" class="os-nav-button">
				<i class="fas fa-home" aria-hidden="true"></i>
				<span>Home</span>
			</a>
			<a href="dashboard.html" class="os-nav-button">
				<i class="fas fa-chart-line" aria-hidden="true"></i>
				<span>Dashboard</span>
			</a>
			<a href="Clientes.html" class="os-nav-button">
				<i class="fas fa-building" aria-hidden="true"></i>
				<span>Clientes</span>
			</a>
			<a href="ordenes.html" class="os-nav-button">
				<i class="far fa-file-alt" aria-hidden="true"></i>
				<span>Ordenes</span>
			</a>
			<a href="cotizaciones.html" class="os-nav-button">
				<i class="fas fa-file-invoice-dollar" aria-hidden="true"></i>
				<span>Cotizaciones</span>
			</a>
			<a href="usuarios.html" class="os-nav-button is-active" data-permission="manage_users">
				<i class="fas fa-user-shield" aria-hidden="true"></i>
				<span>Usuarios</span>
			</a>
			<a href="auditoria.html" class="os-nav-button" data-permission="manage_users">
				<i class="fas fa-history" aria-hidden="true"></i>
				<span>Auditoria</span>
			</a>
			<a href="informes.html" class="os-nav-button">
				<i class="fas fa-chart-bar" aria-hidden="true"></i>
				<span>Informes</span>
			</a>
		</nav>

		<section class="os-panel">
			<div class="os-section-head">
				<h2>Gestion usuarios</h2>
			</div>
			<form id="userForm" class="os-inline-form" autocomplete="off">
				<label>
					<span>Nombre</span>
					<input type="text" id="userName" required>
				</label>
				<label>
					<span>Email</span>
					<input type="email" id="userEmail" required>
				</label>
				<label>
					<span>Rol</span>
					<select id="userRole" required>
						<option value="administrador">Administrador</option>
						<option value="comercial">Comercial</option>
						<option value="operaciones">Operaciones</option>
						<option value="facturacion">Facturacion</option>
					</select>
				</label>
				<label>
					<span>Clave temporal</span>
					<input type="password" id="userPassword" required>
				</label>
				<button type="submit" class="os-button os-button-primary">Crear usuario</button>
			</form>
			<div class="os-table-wrap">
				<table class="os-table">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Email</th>
							<th>Rol</th>
							<th>Estado</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody id="usersBody"></tbody>
				</table>
			</div>
		</section>

		<section class="os-panel">
			<div class="os-section-head">
				<h2>Datos del sistema</h2>
			</div>
			<div class="os-form-actions">
				<button type="button" class="os-button os-button-ghost" id="resetOrdersBtn" data-permission="manage_users">
					<i class="fas fa-trash-alt" aria-hidden="true"></i>
					<span>Reiniciar ordenes</span>
				</button>
				<p class="os-alert" role="note" style="display:block;margin-top:.5rem;font-size:.8rem;opacity:.7;">
					Elimina todas las ordenes registradas y reinicia el consecutivo a 000700. Solo Administrador.
				</p>
			</div>
		</section>
	</section>
</main>
<script src="ordenes-servicio.js?v=20260528-pdf-duracion-v1"></script>
</body>
</html>
